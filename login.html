<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心灵岛屿 | 登录</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="backend-config.js" defer></script>
    <script src="backend-client.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body class="portal-page">
    <header class="site-header tests-header">
      <a class="brand" href="index.html">心灵岛屿</a>
      <nav class="site-nav" aria-label="后台导航">
        <a href="index.html">首页</a>
        <a href="tests.html">心理测试</a>
        <a href="provider.html">服务者后台</a>
        <a href="admin.html">管理员后台</a>
      </nav>
      <a class="nav-link" href="index.html">返回</a>
    </header>
    <main class="portal-shell">
      <section class="portal-card" aria-labelledby="login-title">
        <p class="section-label">ACCOUNT</p>
        <h1 id="login-title">登录心灵岛屿</h1>
        <p>登录后，情绪记录、测试报告和预约线索可以同步到云端。未配置 Supabase 时，网站仍会保留本地体验。</p>
        <label>
          邮箱
          <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>
          密码
          <input id="auth-password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
        </label>
        <label>
          昵称
          <input id="auth-nickname" type="text" placeholder="注册时可填写" />
        </label>
        <div class="portal-actions">
          <button class="solid-button" type="button" id="sign-in">登录</button>
          <button class="ghost-button" type="button" id="sign-up">注册</button>
          <button class="ghost-button" type="button" id="sign-out">退出</button>
        </div>
        <p class="booking-summary" id="auth-status" aria-live="polite">正在检查后端配置...</p>
      </section>
    </main>
  </body>
</html>
