<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心灵岛屿 | 管理员后台</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="backend-config.js" defer></script>
    <script src="backend-client.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body class="portal-page">
    <header class="site-header tests-header">
      <a class="brand" href="index.html">心灵岛屿</a>
      <nav class="site-nav" aria-label="后台导航">
        <a href="login.html">登录</a>
        <a href="provider.html">服务者后台</a>
        <a href="tests.html">心理测试</a>
      </nav>
      <a class="nav-link" href="index.html">首页</a>
    </header>
    <main class="portal-shell wide">
      <section class="portal-card">
        <p class="section-label">ADMIN</p>
        <h1>预约线索后台</h1>
        <p>查看用户提交的预约线索，识别高风险内容，并分配给倾听员或咨询师。后台默认只展示必要摘要，避免暴露客户隐私。</p>
        <div class="portal-filters">
          <select id="admin-status">
            <option value="">全部状态</option>
            <option value="new">新线索</option>
            <option value="assigned">已分配</option>
            <option value="contacted">已联系</option>
            <option value="completed">已完成</option>
            <option value="unreachable">无法联系</option>
          </select>
          <label class="inline-check"><input id="admin-risk" type="checkbox" /> 只看高风险</label>
          <button class="solid-button" type="button" id="load-admin-requests">刷新</button>
        </div>
        <div class="portal-list" id="admin-request-list"></div>
        <p class="booking-summary" id="admin-status-text" aria-live="polite">正在等待加载。</p>
      </section>
    </main>
  </body>
</html>
